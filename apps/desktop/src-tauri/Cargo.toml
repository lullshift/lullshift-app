[package]
name = "lullshift-desktop"
description = "Lullshift desktop app (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "lullshift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion = { path = "../../../crates/companion" }
marketplace = { path = "../../../crates/marketplace" }
pack-media = { path = "../../../crates/pack-media" }
agent-adapters.workspace = true
agent-core.workspace = true
agent-ipc.workspace = true
getrandom.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
include_dir = "0.7"
local-store.workspace = true
# Already in the lockfile through Tauri; used for engine data-schema patterns (ADR-016).
regex = "1.13"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
time.workspace = true
sha2.workspace = true
zeroize = "1.9"

# WebRTC is turned off in the webview at run time on macOS and Linux (src/webrtc.rs, ADR-012).
# Both are already in the lockfile through wry; the versions and features match its own.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
companion = { path = "../../../crates/companion", features = ["test-support"] }
# `file://` marketplaces for the command tests. Debug builds of tests only (see the crate docs).
marketplace = { path = "../../../crates/marketplace", features = ["unsafe-test-file-urls"] }
rusqlite.workspace = true
tempfile.workspace = true

# The workspace lints, except that unsafe code is denied rather than forbidden: the macOS part
# of src/webrtc.rs allows it for a few WebKit messages (ADR-012), and a test fails if any other
# file does. Keep the rest in step with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
