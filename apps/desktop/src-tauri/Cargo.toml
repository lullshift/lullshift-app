[package]
name = "lullshift-desktop"
description = "Lullshift desktop app (Tauri 2 shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue #8519 on Windows).
name = "lullshift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion = { path = "../../../crates/companion" }
marketplace = { path = "../../../crates/marketplace" }
pack-media = { path = "../../../crates/pack-media" }
agent-adapters.workspace = true
agent-core.workspace = true
agent-ipc.workspace = true
getrandom.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
include_dir = "0.7"
local-store.workspace = true
# Already in the lockfile through Tauri; used for engine data-schema patterns (ADR-016).
regex = "1.13"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Opens a confirmed http(s) link in the default browser (decision 36). Used from Rust only, behind
# `companion_open_link`; the plugin is not registered, so the webview gets no opener permission.
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "2"
time.workspace = true
# Already in the lockfile through Tauri; parses and re-serialises links before opening them.
url = "2.5"
sha2.workspace = true
zeroize = "1.9"
# The one Win32 call that tells whether Lullshift runs inside another app's package
# (decision 33). Holds the unsafe code so this crate can keep forbidding it; a no-op elsewhere.
windows-package = { path = "../../../crates/windows-package" }

# WebRTC is turned off in the webview at run time on macOS and Linux (src/webrtc.rs, ADR-012).
# macOS: the Objective-C messages live in `macos-webrtc`, the one crate that allows unsafe code,
# so this crate can forbid it. Linux: `webkit2gtk` is already in the lockfile through wry; the
# version and features match its own.
[target.'cfg(target_os = "macos")'.dependencies]
macos-webrtc = { path = "../../../crates/macos-webrtc" }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
companion = { path = "../../../crates/companion", features = ["test-support"] }
# `file://` marketplaces for the command tests. Debug builds of tests only (see the crate docs).
marketplace = { path = "../../../crates/marketplace", features = ["unsafe-test-file-urls"] }
rusqlite.workspace = true
tempfile.workspace = true

# The workspace lints, which forbid unsafe code. The macOS WebKit messages live in the separate
# `macos-webrtc` crate (ADR-012); a test in src/webrtc.rs checks that every other crate keeps
# inheriting these lints.
[lints]
workspace = true
