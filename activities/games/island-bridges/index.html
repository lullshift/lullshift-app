<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Island Bridges</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Island Bridges</h1>
      <p class="lede">
        Join the numbered islands with bridges so every island has its number and all islands
        connect.
      </p>

      <div class="options">
        <label for="size">Size</label>
        <select id="size">
          <option value="7">7 by 7</option>
          <option value="9">9 by 9</option>
        </select>
      </div>

      <div class="status">
        <p id="moves" class="stat">Moves: 0</p>
        <p id="best" class="stat" hidden></p>
        <p id="done" class="stat">Complete 0</p>
        <p id="groups" class="stat">Groups</p>
      </div>

      <div id="grid" class="sea"></div>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <div class="controls">
        <button id="undo" type="button">Undo</button>
        <button id="restart" type="button">Restart</button>
        <button id="daily" type="button">Today's sea</button>
        <button id="fresh" type="button">New sea</button>
      </div>
    </main>
    <script src="lullshift-bridge-v1.js"></script>
    <script src="lullshift-grid-kit-v1.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
