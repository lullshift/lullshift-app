<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tide Pairs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Tide Pairs</h1>
      <p class="lede">Turn two shells at a time and find the matching pairs.</p>

      <div class="status">
        <p id="pairs" class="stat">Pairs: 0 of 8</p>
        <p id="turns" class="stat">Turns: 0</p>
        <p id="best" class="stat" hidden></p>
      </div>

      <div id="board" class="board cols-4"></div>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <div class="controls">
        <button id="daily" type="button">Daily deal</button>
        <button id="fresh" type="button">New deal</button>
        <button id="size" type="button">Bigger</button>
      </div>
    </main>
    <script src="lullshift-bridge-v1.js"></script>
    <script src="lullshift-card-kit-v1.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
