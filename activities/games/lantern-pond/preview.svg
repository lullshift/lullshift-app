<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Lantern Pond: a night pond with a grid of lanterns, some lit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a2e"/>
      <stop offset="1" stop-color="#2b2748"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5dc8c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5dc8c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <circle cx="272" cy="34" r="14" fill="#ece6ff" opacity="0.85"/>
  <ellipse cx="160" cy="118" rx="140" ry="70" fill="#24213d"/>
  <g id="lanterns">
    <!-- 5 by 5 lanterns; lit ones glow. Original art for Lullshift. -->
    <g fill="#f0d27a" stroke="#8a6d1a" stroke-width="1.5">
      <circle cx="104" cy="70" r="20" fill="url(#glow)" stroke="none"/><circle cx="104" cy="70" r="8"/>
      <circle cx="132" cy="70" r="20" fill="url(#glow)" stroke="none"/><circle cx="132" cy="70" r="8"/>
      <circle cx="188" cy="70" r="20" fill="url(#glow)" stroke="none"/><circle cx="188" cy="70" r="8"/>
      <circle cx="160" cy="94" r="20" fill="url(#glow)" stroke="none"/><circle cx="160" cy="94" r="8"/>
      <circle cx="216" cy="94" r="20" fill="url(#glow)" stroke="none"/><circle cx="216" cy="94" r="8"/>
      <circle cx="104" cy="118" r="20" fill="url(#glow)" stroke="none"/><circle cx="104" cy="118" r="8"/>
      <circle cx="132" cy="118" r="20" fill="url(#glow)" stroke="none"/><circle cx="132" cy="118" r="8"/>
      <circle cx="160" cy="118" r="20" fill="url(#glow)" stroke="none"/><circle cx="160" cy="118" r="8"/>
      <circle cx="188" cy="142" r="20" fill="url(#glow)" stroke="none"/><circle cx="188" cy="142" r="8"/>
      <circle cx="132" cy="166" r="20" fill="url(#glow)" stroke="none"/><circle cx="132" cy="166" r="8"/>
      <circle cx="216" cy="166" r="20" fill="url(#glow)" stroke="none"/><circle cx="216" cy="166" r="8"/>
    </g>
    <g fill="none" stroke="#8f879c" stroke-width="1.5">
      <circle cx="160" cy="70" r="8"/><circle cx="216" cy="70" r="8"/>
      <circle cx="104" cy="94" r="8"/><circle cx="132" cy="94" r="8"/><circle cx="188" cy="94" r="8"/>
      <circle cx="188" cy="118" r="8"/><circle cx="216" cy="118" r="8"/>
      <circle cx="104" cy="142" r="8"/><circle cx="132" cy="142" r="8"/><circle cx="160" cy="142" r="8"/><circle cx="216" cy="142" r="8"/>
      <circle cx="104" cy="166" r="8"/><circle cx="160" cy="166" r="8"/><circle cx="188" cy="166" r="8"/>
    </g>
  </g>
</svg>
