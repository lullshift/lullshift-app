<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kite Drift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Kite Drift</h1>
      <p class="lede">Hold to lift, let go to sink. Glide through the gaps between the clouds.</p>
      <p id="status" class="status">Gaps 0. Best streak 0.</p>
      <canvas
        id="field"
        class="field"
        width="400"
        height="300"
        tabindex="0"
        role="application"
        aria-label="Sky. Hold Space or the Up arrow to lift the kite, release to sink. Fly through the gaps between cloud banks."
      ></canvas>
      <p id="prompt" class="prompt" role="status" aria-live="polite"></p>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <button id="hold" class="hold" type="button" aria-label="Lift the kite. Press and hold.">
        Hold to lift
      </button>
      <div class="controls">
        <button id="again" type="button">New flight</button>
      </div>
    </main>
    <script src="lullshift-bridge-v1.js"></script>
    <script src="lullshift-arcade-kit-v1.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
