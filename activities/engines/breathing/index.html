<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breathing Space</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 id="title">Breathing Space</h1>
      <p id="intro" class="lede" hidden></p>

      <div class="stage" aria-hidden="true">
        <div class="ring">
          <div id="orb" class="orb" data-kind="rest"></div>
        </div>
        <p id="count" class="count"></p>
      </div>

      <p id="cue" class="cue" role="status" aria-live="polite"></p>
      <p id="round" class="round"></p>
      <p id="note" class="note" hidden></p>

      <div class="controls">
        <button id="toggle" type="button">Begin</button>
        <button id="restart" type="button">Restart</button>
      </div>
    </main>
    <script src="lullshift-bridge-v1.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
