<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Away Prompts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 id="title">Away Prompts</h1>
      <p id="intro" class="lede" hidden></p>

      <section class="clockcard" aria-labelledby="away-label">
        <p id="away-label" class="label">Time away</p>
        <p id="clock" class="clock" role="timer" aria-live="off">00:00</p>
      </section>

      <section id="card" class="card" tabindex="0" aria-labelledby="category prompt">
        <p id="category" class="category" hidden></p>
        <p id="prompt" class="prompt"></p>
      </section>

      <p id="progress" class="progress"></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="controls">
        <button id="prev" type="button">Previous idea</button>
        <button id="next" type="button">Another idea</button>
        <button id="back" type="button">Back at desk</button>
      </div>
    </main>
    <script src="lullshift-bridge-v1.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
