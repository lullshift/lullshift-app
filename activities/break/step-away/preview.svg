      <stop offset="0" stop-color="#f6f2ec"/>
      <stop offset="1" stop-color="#ece6ff"/>
    </linearGradient>
    <radialGradient id="breath" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9a6ff" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#b9a6ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/>
