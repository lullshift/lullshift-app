[package]
name = "marketplace"
description = "Lullshift Git marketplaces: hardened git runner, index and pack validation, pinned installs (ADR-015)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Lets another crate's TESTS use `file://` repositories (`Git::for_tests`, `GitUrl::for_test_file`).
# Enable it only from a `[dev-dependencies]` entry. Even then it is compiled in only when
# `debug_assertions` is on, so no release build can contain it.
unsafe-test-file-urls = []

[dependencies]
# Engine data-schema checks (ADR-016, Sprint 12 amendment). Pinned exactly: 0.x releases break
# often and every bump must re-run the shared Ajv/Rust corpus. No default features: that drops
# the HTTP and file retrievers (reqwest, rustls) and IDNA; the host also runs it offline.
jsonschema = { version = "=0.60.2", default-features = false }
# Pack images (S12-T11): the same checks at install as when the app loads a pack.
pack-media = { path = "../pack-media" }
# JavaScript-faithful `pattern` translation (data_schema.rs); already in the lockfile via Tauri.
regex = "1.13"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The one-request redirect probe (decision 18.1). Same version and features as the Companion's,
# so the lockfile gains no new crates.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }

# The built-in Git used when no `git` is on PATH (decision 28, ADR-023). Pure Rust, no default
# features: only the blocking network client and SHA-1. No HTTP backend from gix: the
# transport is ours (gix_transport's `Http` trait over the same ureq as the redirect probe), so
# the address pin, redirects, TLS roots, the size cap and timeouts are all under our control.
gix = { version = "=0.90.0", default-features = false, features = ["blocking-network-client", "sha1"] }
# Only to switch on gix's backend-neutral HTTP layer (`http-client`: the `Http` trait and
# `connect_http`), without curl or reqwest. Same version gix 0.90.0 depends on.
gix-transport = { version = "=0.62.0", default-features = false, features = ["http-client"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
