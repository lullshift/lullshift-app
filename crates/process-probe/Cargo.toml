[package]
name = "process-probe"
description = "Read-only process lookups for the process check (decision 35, ADR-025): the agent's process behind a hook, and whether a recorded process is still the same one. Allows unsafe code for a few Win32 calls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Already in the lockfile (0.61.2, through Tauri's dependencies); pinned to that exact version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Deliberately not `workspace = true`: the workspace forbids unsafe code, and this crate holds
# the Win32 calls that need it so that `agent-adapters` and `lullshift-desktop` keep
# `forbid(unsafe_code)`. Only the Windows module contains `unsafe`. A test in `lullshift-desktop`
# (src/webrtc.rs) fails if any crate other than `macos-webrtc`, `windows-package` and this one
# stops inheriting the workspace lints, and counts the unsafe blocks.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
