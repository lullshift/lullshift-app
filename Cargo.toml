[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lullshift/lullshift-app"
rust-version = "1.99"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
local-store = { path = "crates/local-store" }
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
agent-ipc = { path = "crates/agent-ipc" }
getrandom = "0.4"
libc = "0.2"
tokio = "1.54"
agent-adapters = { path = "crates/agent-adapters" }
process-probe = { path = "crates/process-probe" }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
uuid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Debug builds of the deflate implementation are slow enough to make the 500 MB image-bomb
# fixture in pack-media take half a minute; optimise it (and only it) in dev and test builds.
[profile.dev.package.miniz_oxide]
opt-level = 3
